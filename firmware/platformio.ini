; MeshUptime -- zelfstandig PlatformIO-project.
;
; DIT IS DE VOORKEURSWEG. Eén bron: deze repo. MeshCore is een GEPINDE
; afhankelijkheid als git-submodule onder firmware/vendor/MeshCore (tag
; companion-v1.17.0). Geen twee-bomen-sync, geen handmatige kopieerstappen:
;
;     git submodule update --init firmware/vendor/MeshCore
;     cd firmware && pio run -e meshuptime
;
; WAAROM SUBMODULE EN NIET lib_deps: MeshCore's build leunt volledig op zijn
; eigen platformio.ini (de env-boom arduino_base -> esp32_base -> sensor_base ->
; Heltec_lora32_v3), zijn variants/ en zijn boards/. Als library (library.json,
; build_as_lib.py) levert MeshCore alleen bronbestanden en niets van die
; env-, variant- of boardmachinerie. Onze env `meshuptime` erft rechtstreeks van
; `Heltec_lora32_v3`; dat kan alleen als MeshCore's config in het spel is. Een
; submodule houdt de hele boom op de gepinde commit in de repo; lib_deps zou ons
; dwingen die machinerie zelf na te bouwen -- precies de drift die we kwijt
; willen. Zie docs/bouwen.md.
;
; De variants-patch (SENSOR_MANAGER_CLASS in variants/heltec_v3) wordt door de
; pre-build hook apply_patches.py idempotent op de submodule aangebracht -- de
; upstream-boom hoeft in de repo niet met de hand geëditeerd te worden. Zie
; firmware/patches/LEESMIJ.md.

[platformio]
; MeshCore's monorepo-layout hergebruiken IN de submodule -- niets kopiëren.
; PlatformIO leest de [platformio]-sectie alleen uit dit hoofdbestand; de
; extra_configs hieronder leveren enkel de env-definities (base-envs + de
; heltec_v3-variant). MeshCore's eigen [platformio]-sectie (met haar
; variants/*/platformio.ini en platformio.local.ini) wordt daarbij genegeerd,
; dus die recursie treedt niet op.
src_dir = vendor/MeshCore/src
include_dir = vendor/MeshCore/include
lib_dir = vendor/MeshCore/lib
boards_dir = vendor/MeshCore/boards
extra_configs =
  vendor/MeshCore/platformio.ini
  vendor/MeshCore/variants/heltec_v3/platformio.ini

; CI-spiegel: firmware/platformio.ci.ini hoort dezelfde vlaggen te dragen als
; deze env (op de wifi-plaatshouders na). Wijzig je hier iets, wijzig het daar.
[env:meshuptime]
extends = Heltec_lora32_v3
; extends erft esp32_base's `extra_scripts = merge-bin.py` (project-relatief) en
; dat pad bestaat niet vanuit firmware/. We overschrijven het dus: eerst onze
; patch-hook, dan de gevendorde merge-bin.py met absoluut pad.
extra_scripts =
  pre:apply_patches.py
  ${PROJECT_DIR}/vendor/MeshCore/merge-bin.py
build_flags =
  ${Heltec_lora32_v3.build_flags}
  ; MeshCore's base-config zet `-I variants/heltec_v3` PROJECT-relatief; vanuit
  ; firmware/ klopt dat niet meer (src_dir wijst naar de submodule). Absoluut
  ; toevoegen zodat target.h en HeltecV3Board.h gevonden worden. src_dir en
  ; include_dir voegt PlatformIO zelf al toe.
  -I vendor/MeshCore/variants/heltec_v3
  -D ADVERT_NAME='"MeshUptime"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=33
  -D ENV_PIN_SCL=34
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=32
  -D SENSOR_READ_INTERVAL_SECS=10
  ; Plaatshouders -- dit is een publieke repo. De op het toestel opgeslagen
  ; wifi-instelling is de baas; zie firmware/wifi.ini.voorbeeld. Echte waarden
  ; horen enkel in een lokale, niet-gecommitte platformio.local.ini.
  -D WIFI_SSID='"ci-plaatshouder"'
  -D WIFI_PWD='"ci-plaatshouder"'
  ; Onze eigen SensorManager i.p.v. de standaard; vereist de variants-patch
  ; (pre-build hook). De -I is nodig omdat variants/heltec_v3/target.h onze
  ; header moet vinden. Absoluut pad want src_dir wijst naar de submodule.
  -I examples/meshuptime
  -D SENSOR_MANAGER_CLASS=MonitorSensors
  -D SENSOR_MANAGER_INCLUDE='"MonitorSensors.h"'
; build_src_filter is relatief t.o.v. src_dir (=vendor/MeshCore/src). Onze
; example leeft in de repo op firmware/examples/meshuptime; vanuit src_dir is dat
; drie niveaus omhoog (src -> MeshCore -> vendor -> firmware).
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../../../examples/meshuptime>
; ${esp32_ota.lib_deps} bevat `file://arch/esp32/AsyncElegantOTA`, een
; project-relatief pad dat vanuit firmware/ niet klopt. Daarom hier expliciet,
; met absoluut pad naar de gevendorde kopie.
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://${PROJECT_DIR}/vendor/MeshCore/arch/esp32/AsyncElegantOTA
