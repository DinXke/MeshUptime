; CI-spiegel van de echte env:meshuptime (de platformio.local.ini in de
; bouwkopie). De CI-workflow (.github/workflows/build.yml) kopieert dit bestand
; naar <meshcore>/platformio.local.ini -- MeshCore's platformio.ini leest die
; via extra_configs -- en draait dan `pio run -e meshuptime`.
;
; DEZE TWEE MOETEN GELIJK BLIJVEN op de wifi-gegevens na. Elke vlag die in de
; bouwkopie bij komt of verandert, hoort ook hier te veranderen -- anders bouwt
; de CI een andere firmware dan de mens en vangt hij precies de fouten niet
; waarvoor hij bestaat: ontbrekende symbolen, kapotte literalen en
; main.cpp-drift.
;
; GEEN ECHTE WIFI-GEGEVENS IN DIT BESTAND. Dit staat in een publieke repo; de
; plaatshouders hieronder zijn genoeg om te compileren (de opgeslagen instelling
; is op het toestel toch de baas; zie wifi.ini.voorbeeld). De echte waarden
; horen uitsluitend in platformio.local.ini van de bouwkopie, die in MeshCore's
; .gitignore staat.
;
; Deze env veronderstelt dat firmware/patches/0001-sensor-manager-class-
; heltec-v3.patch is AANGEBRACHT (git apply, tegen tag companion-v1.17.0):
; zonder die patch bestaan SENSOR_MANAGER_CLASS/INCLUDE niet in
; variants/heltec_v3 en bouwt de variant de gewone EnvironmentSensorManager.
[env:meshuptime]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D ADVERT_NAME='"MeshUptime"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ENV_PIN_SDA=33
  -D ENV_PIN_SCL=34
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=32
  -D SENSOR_READ_INTERVAL_SECS=10
  ; Plaatshouders -- zie de kop van dit bestand.
  -D WIFI_SSID='"ci-plaatshouder"'
  -D WIFI_PWD='"ci-plaatshouder"'
  ; Onze eigen SensorManager in de plaats van de standaard; vereist de patch
  ; hierboven. De -I is nodig omdat variants/heltec_v3/target.h onze header
  ; moet vinden.
  -I examples/meshuptime
  -D SENSOR_MANAGER_CLASS=MonitorSensors
  -D SENSOR_MANAGER_INCLUDE='"MonitorSensors.h"'
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/meshuptime>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
